[project]
name = "buy-or-wait"
version = "0.1.0"
description = "Buy or Wait? financial decision agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cursor-sdk>=0.1",
    "python-dotenv>=1.0",
    "typer>=0.16",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["tests"]
markers = ["live: hits the Cursor SDK with a real API key"]

[tool.ruff]
src = ["code", "tests"]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["code", "tests"]
extraPaths = ["code"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
